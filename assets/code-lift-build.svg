<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.45" stop-color="#111111"/>
      <stop offset="1" stop-color="#F7C845"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE89A"/>
      <stop offset="1" stop-color="#F7C845"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.96  0 1 0 0 0.78  0 0 1 0 0.27  0 0 0 0.9 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="145" fill="#000" opacity="0.16"/>
  <circle cx="1060" cy="285" r="95" fill="#000" opacity="0.18"/>
  <path d="M0 292 C210 240 340 330 540 275 C760 214 900 255 1200 202 V360 H0 V292Z" fill="#000" opacity="0.38"/>

  <g transform="translate(72 58)">
    <text x="0" y="62" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">CODE. LIFT. BUILD.</text>
    <text x="0" y="110" fill="#F7C845" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Full-Stack Developer • Bodybuilder • Ex-Military • Maynooth CS</text>
    <text x="0" y="158" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="22">I turn pressure into systems, bugs into lessons, and heavy days into stronger output.</text>
    <g transform="translate(0 206)">
      <rect x="0" y="0" width="238" height="52" rx="18" fill="#F7C845"/>
      <text x="24" y="34" fill="#000" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">npm run discipline</text>
      <rect x="258" y="0" width="190" height="52" rx="18" fill="#101010" stroke="#F7C845" stroke-width="2"/>
      <text x="283" y="34" fill="#F7C845" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">git push grit</text>
    </g>
  </g>

  <g transform="translate(800 88)" filter="url(#glow)">
    <rect x="55" y="78" width="250" height="34" rx="17" fill="#111" stroke="#F7C845" stroke-width="8"/>
    <rect x="0" y="58" width="52" height="74" rx="12" fill="url(#gold)"/>
    <rect x="312" y="58" width="52" height="74" rx="12" fill="url(#gold)"/>
    <rect x="77" y="18" width="28" height="154" rx="10" fill="url(#gold)"/>
    <rect x="259" y="18" width="28" height="154" rx="10" fill="url(#gold)"/>
    <path d="M150 61 L183 34 L216 61 L216 140 L150 140 Z" fill="#F7C845" opacity="0.95"/>
    <path d="M164 78 H202 M164 99 H202 M164 120 H190" stroke="#050505" stroke-width="8" stroke-linecap="round"/>
    <text x="78" y="220" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">BUGS GET REPS TOO</text>
  </g>
</svg>
