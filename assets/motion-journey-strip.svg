<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.58" stop-color="#111111"/>
      <stop offset="1" stop-color="#2A2108"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C845" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F7C845" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes moveDash { to { stroke-dashoffset: -460; } }
      @keyframes pulse { 0%,100% { opacity:.42; transform:scale(1); } 50% { opacity:1; transform:scale(1.1); } }
      .route { stroke-dasharray:14 18; animation: moveDash 8s linear infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
    </style>
  </defs>
  <rect width="1200" height="260" rx="36" fill="url(#bg)"/>
  <circle cx="1020" cy="75" r="155" fill="url(#glow)" opacity="0.13"/>
  <circle cx="135" cy="220" r="105" fill="url(#glow)" opacity="0.08"/>
  <path id="road" d="M120 150 C250 60 370 218 500 142 C655 52 780 210 910 130 C1010 68 1060 100 1110 78" stroke="#F7C845" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
  <path class="route" d="M120 150 C250 60 370 218 500 142 C655 52 780 210 910 130 C1010 68 1060 100 1110 78" stroke="#F7C845" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  <circle r="13" fill="#ffffff" filter="url(#blur)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto"><mpath href="#road"/></animateMotion>
  </circle>
  <g>
    <circle class="pulse" cx="120" cy="150" r="34" fill="#0D0D0D" stroke="#F7C845" stroke-width="5"/>
    <circle class="pulse" cx="500" cy="142" r="34" fill="#0D0D0D" stroke="#F7C845" stroke-width="5"/>
    <circle class="pulse" cx="910" cy="130" r="34" fill="#0D0D0D" stroke="#F7C845" stroke-width="5"/>
    <circle class="pulse" cx="1110" cy="78" r="34" fill="#0D0D0D" stroke="#F7C845" stroke-width="5"/>
  </g>
</svg>