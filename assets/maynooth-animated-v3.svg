<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06111F"/>
      <stop offset="0.58" stop-color="#0D0D0D"/>
      <stop offset="1" stop-color="#2A2108"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C845" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F7C845" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
      @keyframes pulse { 0%,100% { opacity:.38; } 50% { opacity:1; } }
      @keyframes draw { 0% { stroke-dashoffset:520; } 55%,100% { stroke-dashoffset:0; } }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .draw { stroke-dasharray:520; animation: draw 4.8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="500" rx="44" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="200" fill="url(#goldGlow)" opacity="0.12"/>
  <circle cx="145" cy="415" r="130" fill="url(#goldGlow)" opacity="0.07"/>

  <text x="70" y="96" fill="#F7C845" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" letter-spacing="4">ACADEMIC BASE</text>
  <text x="70" y="188" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900">Maynooth CS</text>
  <text x="70" y="272" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900">Computer Science</text>
  <text x="74" y="382" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Java · Logic · Systems</text>
  <text x="74" y="424" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Software Engineering</text>

  <g transform="translate(825 110)" class="float">
    <rect x="0" y="0" width="300" height="240" rx="30" fill="#0A0A0A" stroke="#F7C845" stroke-width="5"/>
    <circle cx="38" cy="36" r="8" fill="#F7C845" opacity="1"/>
    <circle cx="68" cy="36" r="8" fill="#F7C845" opacity=".55"/>
    <circle cx="98" cy="36" r="8" fill="#F7C845" opacity=".32"/>
    <path class="draw" d="M44 88 H248 M44 132 H210 M44 176 H250" stroke="#F7C845" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 298 C100 246 174 342 260 278" stroke="#F7C845" stroke-width="6" stroke-linecap="round" opacity=".78"/>
    <circle class="pulse" cx="40" cy="298" r="10" fill="#F7C845"/>
    <circle class="pulse" cx="260" cy="278" r="10" fill="#F7C845"/>
  </g>
</svg>