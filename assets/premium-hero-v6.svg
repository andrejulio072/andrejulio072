<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#101010"/>
      <stop offset="1" stop-color="#2B2208"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C845" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#F7C845" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rightClip"><rect x="720" y="0" width="480" height="520" rx="38"/></clipPath>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 L0 0 0 42" stroke="#F7C845" stroke-opacity="0.055" stroke-width="1" fill="none"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes pulse { 0%,100% { opacity:.38; transform:scale(1); } 50% { opacity:1; transform:scale(1.08); } }
      @keyframes dash { to { stroke-dashoffset:-520; } }
      @keyframes scan { 0% { transform: translateX(-180px); opacity:0; } 25% { opacity:.75; } 75% { opacity:.75; } 100% { transform: translateX(180px); opacity:0; } }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .pulse { animation: pulse 2.3s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .dash { stroke-dasharray:16 18; animation: dash 8s linear infinite; }
      .scan { animation: scan 4.6s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="44" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="44" fill="url(#grid)"/>
  <circle cx="1010" cy="120" r="220" fill="url(#goldGlow)" opacity="0.16"/>
  <circle cx="130" cy="430" r="135" fill="url(#goldGlow)" opacity="0.08"/>
  <path d="M72 438 H680" stroke="#F7C845" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <text x="72" y="105" fill="#F7C845" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" letter-spacing="4">MY BUILD SYSTEM</text>
  <text x="72" y="180" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">CODE. LIFT.</text>
  <text x="72" y="256" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">BUILD.</text>
  <text x="76" y="365" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Logic under pressure. Discipline in reps.</text>
  <text x="76" y="407" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Systems that work.</text>
  <g clip-path="url(#rightClip)">
    <g transform="translate(785 90)" class="float" filter="url(#glow)">
      <rect x="0" y="0" width="360" height="360" rx="40" fill="#0A0A0A" stroke="#F7C845" stroke-width="5" opacity="0.94"/>
      <g class="scan"><rect x="55" y="22" width="70" height="316" rx="20" fill="#F7C845" opacity="0.08"/></g>
      <rect x="92" y="110" width="176" height="26" rx="13" fill="#F7C845"/>
      <rect x="34" y="74" width="64" height="100" rx="18" fill="#F7C845"/>
      <rect x="262" y="74" width="64" height="100" rx="18" fill="#F7C845"/>
      <path d="M100 238 L52 278 L100 318" stroke="#F7C845" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M260 238 L308 278 L260 318" stroke="#F7C845" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M190 230 L154 324" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
      <circle class="pulse" cx="180" cy="180" r="122" fill="none" stroke="#F7C845" stroke-width="4" opacity="0.55"/>
    </g>
    <circle class="pulse" cx="752" cy="90" r="8" fill="#F7C845"/>
    <circle class="pulse" cx="1140" cy="448" r="9" fill="#F7C845"/>
  </g>
</svg>