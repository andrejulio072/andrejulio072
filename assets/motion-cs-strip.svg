    <rect x="0" y="0" width="330" height="170" rx="28" fill="#0A0A0A" stroke="#F7C845" stroke-width="5"/>
    <circle cx="38" cy="34" r="8" fill="#F7C845"/>
    <circle cx="68" cy="34" r="8" fill="#F7C845" opacity=".55"/>
