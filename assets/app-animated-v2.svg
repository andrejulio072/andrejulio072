<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.6" stop-color="#121212"/>
      <stop offset="1" stop-color="#2A2108"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C845" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F7C845" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-16px); } }
      @keyframes fillA { 0%,100% { width: 72px; } 50% { width: 138px; } }
      @keyframes fillB { 0%,100% { width: 122px; } 50% { width: 82px; } }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .barA { animation: fillA 3s ease-in-out infinite; }
      .barB { animation: fillB 3.5s ease-in-out infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="44" fill="url(#bg)"/>
  <circle cx="1020" cy="105" r="190" fill="url(#glow)" opacity="0.13"/>
  <circle cx="145" cy="440" r="130" fill="url(#glow)" opacity="0.07"/>

  <text x="72" y="105" fill="#F7C845" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" letter-spacing="4">CURRENT BUILD</text>
  <text x="72" y="195" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900">Garcia Builder</text>
  <text x="72" y="285" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900">Fitness App</text>
  <text x="76" y="415" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Training. Nutrition. Check-ins. Behaviour.</text>

  <g transform="translate(875 105)" class="float" filter="url(#softGlow)">
    <rect x="0" y="0" width="230" height="330" rx="46" fill="#080808" stroke="#F7C845" stroke-width="7"/>
    <rect x="34" y="44" width="162" height="242" rx="28" fill="#171717"/>
    <circle cx="115" cy="92" r="40" fill="#F7C845"/>
    <path d="M98 94 L111 107 L136 76" stroke="#050505" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="barA" x="62" y="158" width="72" height="16" rx="8" fill="#F7C845"/>
    <rect class="barB" x="62" y="194" width="122" height="16" rx="8" fill="#777777"/>
    <rect x="62" y="230" width="96" height="16" rx="8" fill="#777777" opacity="0.75"/>
  </g>

  <circle class="pulse" cx="838" cy="178" r="12" fill="#F7C845"/>
  <circle class="pulse" cx="1118" cy="390" r="10" fill="#F7C845"/>
  <path d="M837 178 C795 220 790 275 845 328" stroke="#F7C845" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
</svg>
