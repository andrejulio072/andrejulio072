    <path d="M0 130 H120 C160 130 170 170 225 170 H330" stroke="#F7C845" stroke-width="6" stroke-linecap="round" opacity="0.42"/>
    <circle class="pulse" cx="0" cy="70" r="10" fill="#F7C845"/>
    <circle class="pulse" cx="290" cy="5" r="10" fill="#F7C845"/>
    <circle class="pulse" cx="330" cy="170" r="10" fill="#F7C845"/>
  </g>
  <g transform="translate(930 45)" class="float">
