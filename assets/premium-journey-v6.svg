<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#101010"/>
      <stop offset="1" stop-color="#2B2208"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C845" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#F7C845" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rightClip"><rect x="720" y="0" width="480" height="520" rx="38"/></clipPath>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 L0 0 0 42" stroke="#F7C845" stroke-opacity="0.055" stroke-width="1" fill="none"/>
    </pattern>
    <style>
      @keyframes pulse { 0%,100% { opacity:.38; transform:scale(1); } 50% { opacity:1; transform:scale(1.08); } }
      @keyframes dash { to { stroke-dashoffset:-520; } }
      .pulse { animation: pulse 2.3s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .dash { stroke-dasharray:16 18; animation: dash 8s linear infinite; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="44" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="44" fill="url(#grid)"/>
  <circle cx="1010" cy="120" r="220" fill="url(#goldGlow)" opacity="0.16"/>
  <circle cx="130" cy="430" r="135" fill="url(#goldGlow)" opacity="0.08"/>
  <path d="M72 438 H680" stroke="#F7C845" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <text x="72" y="105" fill="#F7C845" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" letter-spacing="4">JOURNEY</text>
  <text x="72" y="180" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">BUILT THROUGH</text>
  <text x="72" y="256" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">PRESSURE.</text>
  <text x="76" y="365" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Brazil → Spain → London → Ireland</text>
  <text x="76" y="407" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Military roots. Builder mindset.</text>
  <g clip-path="url(#rightClip)">
    <g transform="translate(730 90)">
      <path d="M35 295 C120 180 195 335 285 235 C330 185 370 195 410 130" stroke="#F7C845" stroke-width="11" stroke-linecap="round" opacity="0.25"/>
      <path class="dash" d="M35 295 C120 180 195 335 285 235 C330 185 370 195 410 130" stroke="#F7C845" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
      <circle class="pulse" cx="35" cy="295" r="35" fill="#0D0D0D" stroke="#F7C845" stroke-width="5"/>
      <circle class="pulse" cx="155" cy="253" r="35" fill="#0D0D0D" stroke="#F7C845" stroke-width="5"/>
      <circle class="pulse" cx="285" cy="235" r="35" fill="#0D0D0D" stroke="#F7C845" stroke-width="5"/>
      <circle class="pulse" cx="410" cy="130" r="35" fill="#0D0D0D" stroke="#F7C845" stroke-width="5"/>
      <text x="13" y="305" fill="#F7C845" font-family="Arial" font-size="24" font-weight="900">BR</text>
      <text x="132" y="263" fill="#F7C845" font-family="Arial" font-size="24" font-weight="900">ES</text>
      <text x="258" y="245" fill="#F7C845" font-family="Arial" font-size="24" font-weight="900">UK</text>
      <text x="387" y="140" fill="#F7C845" font-family="Arial" font-size="24" font-weight="900">IE</text>
    </g>
  </g>
</svg>