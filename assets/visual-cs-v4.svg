    <style>
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes draw { 0% { stroke-dashoffset: 520; } 55%,100% { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      .float { animation: float 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .draw { stroke-dasharray:520; animation: draw 4.6s ease-in-out infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1200" height="280" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="150" fill="url(#glow)" opacity="0.13"/>
