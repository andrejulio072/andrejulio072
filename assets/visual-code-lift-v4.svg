<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#0E0E0E"/>
      <stop offset="1" stop-color="#241D08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C845" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#F7C845" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" stroke="#F7C845" stroke-opacity="0.06" stroke-width="1" fill="none"/>
    </pattern>
    <style>
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes pulse { 0%,100% { opacity:.35; transform:scale(1); } 50% { opacity:1; transform:scale(1.08); } }
      @keyframes dash { to { stroke-dashoffset:-480; } }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .dash { stroke-dasharray:18 18; animation: dash 8s linear infinite; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="36" fill="url(#grid)"/>
  <circle cx="220" cy="150" r="140" fill="url(#glow)" opacity="0.12"/>
  <circle cx="980" cy="145" r="155" fill="url(#glow)" opacity="0.14"/>
  <path class="dash" d="M110 230 H1090" stroke="#F7C845" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <g class="float" transform="translate(190 70)">
    <path d="M70 42 L24 80 L70 118" stroke="#F7C845" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M196 42 L242 80 L196 118" stroke="#F7C845" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M148 34 L112 128" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <circle class="pulse" cx="133" cy="80" r="82" stroke="#F7C845" stroke-width="4" fill="none" opacity="0.5"/>
  </g>
  <g class="float" transform="translate(740 72)">
    <rect x="90" y="60" width="190" height="24" rx="12" fill="#F7C845"/>
    <rect x="40" y="28" width="58" height="90" rx="16" fill="#F7C845"/>
    <rect x="272" y="28" width="58" height="90" rx="16" fill="#F7C845"/>
    <rect x="118" y="49" width="28" height="46" rx="10" fill="#EDEDED" opacity="0.85"/>
    <rect x="226" y="49" width="28" height="46" rx="10" fill="#EDEDED" opacity="0.85"/>
    <circle class="pulse" cx="185" cy="73" r="105" stroke="#F7C845" stroke-width="4" fill="none" opacity="0.45"/>
  </g>
  <circle class="pulse" cx="590" cy="72" r="8" fill="#F7C845"/>
  <circle class="pulse" cx="620" cy="250" r="6" fill="#F7C845"/>
</svg>