<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#111111"/>
      <stop offset="1" stop-color="#2A2108"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C845" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F7C845" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#F7C845" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes moveDash { to { stroke-dashoffset: -500; } }
      @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      @keyframes pulse { 0%,100% { opacity:.35; transform:scale(1); } 50% { opacity:1; transform:scale(1.08); } }
      @keyframes scan { 0% { transform: translateX(-240px); opacity:0; } 20% { opacity:.8; } 80% { opacity:.8; } 100% { transform: translateX(940px); opacity:0; } }
      .dash { stroke-dasharray:16 18; animation: moveDash 7s linear infinite; }
      .float { animation: float 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .scan { animation: scan 5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1200" height="260" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="36" fill="url(#grid)"/>
  <circle cx="1040" cy="85" r="170" fill="url(#glow)" opacity="0.14"/>
  <circle cx="140" cy="230" r="120" fill="url(#glow)" opacity="0.08"/>
  <g class="scan"><rect x="50" y="32" width="120" height="196" rx="20" fill="#F7C845" opacity="0.08"/></g>
  <path class="dash" d="M90 132 H1110" stroke="#F7C845" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <g transform="translate(150 63)" class="float" filter="url(#softGlow)">
    <path d="M76 25 L28 67 L76 109" stroke="#F7C845" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M164 25 L212 67 L164 109" stroke="#F7C845" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M130 14 L92 122" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  </g>
  <g transform="translate(482 73)" class="float" filter="url(#softGlow)">
    <rect x="72" y="45" width="175" height="25" rx="13" fill="#F7C845"/>
    <rect x="28" y="18" width="56" height="80" rx="16" fill="#F7C845"/>
    <rect x="236" y="18" width="56" height="80" rx="16" fill="#F7C845"/>
  </g>
  <g transform="translate(875 66)" class="float" filter="url(#softGlow)">
    <rect x="0" y="0" width="150" height="120" rx="28" fill="#0B0B0B" stroke="#F7C845" stroke-width="5"/>
    <path d="M40 78 L75 42 L110 78" stroke="#F7C845" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 92 H100" stroke="#F7C845" stroke-width="13" stroke-linecap="round"/>
  </g>
  <circle class="pulse" cx="90" cy="132" r="9" fill="#F7C845"/>
  <circle class="pulse" cx="1110" cy="132" r="9" fill="#F7C845"/>
  <circle class="pulse" cx="600" cy="132" r="7" fill="#ffffff"/>
</svg>