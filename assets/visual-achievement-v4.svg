    </radialGradient>
    <style>
      @keyframes pulse { 0%,100% { opacity:.4; transform:scale(1); } 50% { opacity:1; transform:scale(1.08); } }
      @keyframes dash { to { stroke-dashoffset:-460; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .dash { stroke-dasharray:16 16; animation: dash 8s linear infinite; }
    </style>
  </defs>
  <rect width="1200" height="280" rx="34" fill="url(#bg)"/>
