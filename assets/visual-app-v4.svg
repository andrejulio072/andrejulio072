<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.6" stop-color="#111111"/>
      <stop offset="1" stop-color="#241D08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C845" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#F7C845" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes fillA { 0%,100% { width:70px; } 50% { width:145px; } }
      @keyframes fillB { 0%,100% { width:135px; } 50% { width:82px; } }
      @keyframes pulse { 0%,100% { opacity:.35; transform:scale(1); } 50% { opacity:1; transform:scale(1.08); } }
      .float { animation: float 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .barA { animation: fillA 3s ease-in-out infinite; }
      .barB { animation: fillB 3.5s ease-in-out infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="75" r="160" fill="url(#glow)" opacity="0.13"/>
  <circle cx="130" cy="250" r="110" fill="url(#glow)" opacity="0.07"/>
  <g class="float" transform="translate(150 38)" filter="url(#softGlow)">
    <rect x="0" y="0" width="170" height="230" rx="38" fill="#080808" stroke="#F7C845" stroke-width="6"/>
    <rect x="28" y="34" width="114" height="166" rx="24" fill="#171717"/>
    <circle cx="85" cy="72" r="32" fill="#F7C845"/>
    <path d="M72 74 L83 85 L102 60" stroke="#050505" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="barA" x="50" y="124" width="70" height="14" rx="7" fill="#F7C845"/>
    <rect class="barB" x="50" y="156" width="135" height="14" rx="7" fill="#777777"/>
  </g>
  <g transform="translate(470 70)">
    <rect x="0" y="0" width="570" height="160" rx="26" fill="#0A0A0A" stroke="#F7C845" stroke-width="4" opacity="0.92"/>
    <rect class="barA" x="55" y="48" width="70" height="18" rx="9" fill="#F7C845"/>
    <rect class="barB" x="55" y="92" width="135" height="18" rx="9" fill="#777777"/>
    <rect x="280" y="48" width="210" height="18" rx="9" fill="#F7C845" opacity="0.75"/>
    <rect x="280" y="92" width="155" height="18" rx="9" fill="#777777" opacity="0.7"/>
  </g>
  <circle class="pulse" cx="390" cy="75" r="10" fill="#F7C845"/>
  <circle class="pulse" cx="1095" cy="238" r="9" fill="#F7C845"/>
  <path d="M390 75 C430 95 420 145 470 150" stroke="#F7C845" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
</svg>