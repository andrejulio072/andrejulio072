<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06111F"/>
      <stop offset="0.58" stop-color="#0D0D0D"/>
      <stop offset="1" stop-color="#2A2108"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C845" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F7C845" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      @keyframes draw { 0% { stroke-dashoffset: 480; } 60%,100% { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      .float { animation: float 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .draw { stroke-dasharray:480; animation: draw 4.5s ease-in-out infinite; }
      .pulse { animation: pulse 2.1s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1200" height="260" rx="36" fill="url(#bg)"/>
  <circle cx="1010" cy="80" r="155" fill="url(#glow)" opacity="0.13"/>
  <circle cx="150" cy="225" r="105" fill="url(#glow)" opacity="0.08"/>
