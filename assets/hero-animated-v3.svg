<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#101010"/>
      <stop offset="1" stop-color="#2B2208"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C845" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F7C845" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 L0 0 0 42" fill="none" stroke="#F7C845" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-16px); } }
      @keyframes pulse { 0%,100% { opacity:.35; transform:scale(1); } 50% { opacity:1; transform:scale(1.08); } }
      @keyframes dash { to { stroke-dashoffset:-480; } }
      @keyframes scan { 0% { transform: translateX(-180px); opacity:0; } 25% { opacity:.8; } 75% { opacity:.8; } 100% { transform: translateX(230px); opacity:0; } }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .dash { stroke-dasharray:16 18; animation: dash 8s linear infinite; }
      .scan { animation: scan 4.8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="500" rx="44" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="44" fill="url(#grid)"/>
  <circle cx="1010" cy="125" r="210" fill="url(#goldGlow)" opacity="0.14"/>
  <circle cx="140" cy="415" r="145" fill="url(#goldGlow)" opacity="0.07"/>

  <text x="70" y="96" fill="#F7C845" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" letter-spacing="4">MY BUILD SYSTEM</text>
  <text x="70" y="188" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900">CODE. LIFT.</text>
  <text x="70" y="272" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900">BUILD.</text>
  <text x="74" y="382" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Logic under pressure. Discipline in reps.</text>
  <text x="74" y="424" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Systems that work.</text>

  <path class="dash" d="M70 320 H675" stroke="#F7C845" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <g transform="translate(805 100)" class="float" filter="url(#glow)">
    <rect x="0" y="0" width="300" height="300" rx="34" fill="#0B0B0B" stroke="#F7C845" stroke-width="5" opacity="0.92"/>
    <g class="scan">
      <rect x="36" y="26" width="58" height="248" rx="18" fill="#F7C845" opacity="0.08"/>
    </g>
    <rect x="72" y="88" width="156" height="24" rx="12" fill="#F7C845"/>
    <rect x="32" y="58" width="50" height="84" rx="16" fill="#F7C845"/>
    <rect x="218" y="58" width="50" height="84" rx="16" fill="#F7C845"/>
    <path d="M76 200 L38 236 L76 272" stroke="#F7C845" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M224 200 L262 236 L224 272" stroke="#F7C845" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M164 194 L132 278" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
    <circle class="pulse" cx="150" cy="150" r="105" fill="none" stroke="#F7C845" stroke-width="4" opacity="0.55"/>
  </g>

  <circle class="pulse" cx="760" cy="95" r="7" fill="#F7C845"/>
  <circle class="pulse" cx="1130" cy="410" r="8" fill="#F7C845"/>
</svg>